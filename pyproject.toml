[project]
name = "page-turner"
version = "0.1.0"
description = "Probe BLE HID page-turner remotes over a Bumble HCI controller, and test them on a Kindle with guard rails."
authors = [{ name = "J.P. Hutchins", email = "jphutchins@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["bumble==0.0.235", "cyclopts==5.2.0", "msgspec==0.22.0"]

[project.scripts]
page-turner = "page_turner.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
dev = [
	{ include-group = "test" },
	"camas[mcp]==0.1.31",
	"mypy==2.4.0",
	"pyright[nodejs]==1.1.414",
	"ruff==0.17.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = ["--doctest-modules"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["external", "handoff"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
	"ASYNC",
	"B",
	"C4",
	"D",
	"DOC102",
	"DOC202",
	"DOC403",
	"DOC501",
	"DOC502",
	"E",
	"F",
	"FA",
	"FLY",
	"FURB",
	"I",
	"ICN",
	"INP",
	"ISC",
	"N",
	"PERF",
	"PGH",
	"PIE",
	"PL",
	"PT",
	"PTH",
	"PYI",
	"RET",
	"RSE",
	"RUF",
	"SIM",
	"SLF",
	"SLOT",
	"TC",
	"TRY",
	"UP",
	"W",
	"YTT",
]
ignore = [
	"W191",
	"E101",
	"E111",
	"E114",
	"E117",
	"D206",
	"D300",
	"ISC001",
	"ISC002",
	"E501",
	"D100",
	"D101",
	"D102",
	"D103",
	"D104",
	"D105",
	"D107",
	"D205",
	"D417",
	"PLC0415",
	"PLR0911",
	"PLR0912",
	"PLR0913",
	"PLR0915",
	"PLR2004",
	"TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "INP001"]
"tasks.py" = ["INP001", "A001"]

[tool.ruff.format]
indent-style = "tab"

[tool.mypy]
strict = true
warn_unused_ignores = true
exclude = ["external/", "handoff/", "build/"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "tasks.py"]
exclude = ["external/**", "handoff/**"]
