name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.emit.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - id: emit
        run: echo "jobs=$(uv run camas check --github-matrix=tasks)" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    strategy:
      matrix: ${{ fromJSON(needs.discover.outputs.jobs) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - run: uv run camas ${{ matrix.task }}
